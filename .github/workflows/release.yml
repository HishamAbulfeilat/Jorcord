name: Release
# Push a tag vX.Y.Z to build everything and publish ONE GitHub Release with every asset attached.
# Run manually (Actions > Release > Run workflow) for a dry run: builds everything and uploads the
# would-be release files as the "release-preview" artifact, but publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Also deploy the web app to GitHub Pages'
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -e
          PKG=$(node -p "require('./package.json').version")
          for f in apps/web apps/server apps/desktop apps/mobile; do
            [ "$(node -p "require('./$f/package.json').version")" = "$PKG" ] || { echo "::error::$f/package.json version differs from $PKG"; exit 1; }
          done
          [ "$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" = "$PKG" ] || { echo "::error::tauri.conf.json version differs from $PKG"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v$PKG" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match package version v$PKG"; exit 1; }
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- web
  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jorcord/shared build --if-present
      - name: Build for GitHub Pages (base path /<repo>/)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC_HOST: '1'
        run: |
          pnpm --filter @jorcord/web build
          cp apps/web/dist/index.html apps/web/dist/404.html   # SPA fallback for deep links
          touch apps/web/dist/.nojekyll
          mv apps/web/dist pages-dist
      - name: Build for any static host (served from the domain root)
        env:
          VITE_STATIC_HOST: '1'
        run: |
          pnpm --filter @jorcord/web build
          cp apps/web/dist/index.html apps/web/dist/404.html
          mkdir -p out
          (cd apps/web/dist && zip -qr "$GITHUB_WORKSPACE/out/jorcord-web-v${{ needs.prepare.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: asset-web, path: out/*, if-no-files-found: error }
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages-dist }

  pages:
    needs: [prepare, web]
    if: needs.prepare.outputs.is_release == 'true' || inputs.publish_pages
    runs-on: ubuntu-latest
    continue-on-error: true   # Pages may not be enabled yet: Settings > Pages > Source: GitHub Actions
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with: { enablement: true }
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------- server + livekit bundles
  server-bundle:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Assemble server tarball
        run: |
          set -e
          V=${{ needs.prepare.outputs.version }}
          D=bundle/jorcord-server
          pnpm --filter @jorcord/server deploy --prod --legacy "$D"
          cp .env.docker.example "$D/.env.example"
          # compose file for the bundle: pull the published image instead of building from source
          grep -v 'build: { context' docker-compose.yml | sed "s|:\${JORCORD_VERSION:-latest}|:\${JORCORD_VERSION:-$V}|" > "$D/docker-compose.yml"
          cp scripts/init-env.sh "$D/init-env.sh"
          cat > "$D/run.sh" <<'EOT'
          #!/bin/sh
          # Runs the Jorcord server directly with Node 22+. Reads ./.env if present. Data lives in ./data unless DATA_DIR is set.
          cd "$(dirname "$0")"
          [ -f .env ] && { set -a; . ./.env; set +a; }
          export NODE_ENV="${NODE_ENV:-production}" DATA_DIR="${DATA_DIR:-$PWD/data}"
          exec node_modules/.bin/tsx src/index.ts
          EOT
          sed -i 's/^          //' "$D/run.sh"
          chmod +x "$D/run.sh" "$D/init-env.sh"
          cat > "$D/README.txt" <<EOT
          Jorcord server v$V
          Node 22+ and Linux x64 (the bundled node_modules contain native modules for linux-x64/glibc).
          On other platforms or CPUs use the Docker image: docker pull ghcr.io/hishamabulfeilat/jorcord-server:$V

          Quick start (embedded database, no other services needed):
            JWT_SECRET=\$(openssl rand -base64 48) ./run.sh        # listens on :3000
          Full stack (Postgres, Redis, LiveKit, MinIO):
            ./init-env.sh && docker compose up -d
          Then open the Jorcord web/desktop/mobile app and enter http://localhost:3000 as the server address.
          Migrations (migrations/) run automatically on boot.
          EOT
          sed -i 's/^          //' "$D/README.txt"
          mkdir -p out
          tar -C bundle -czf "out/jorcord-server-v$V.tar.gz" jorcord-server
          # LiveKit config bundle (no binary)
          mkdir -p lk/jorcord-livekit-config
          (cd infra/livekit && cp -r README.md docker-compose.yml livekit.yaml ../../lk/jorcord-livekit-config/)
          tar -C lk -czf "out/jorcord-livekit-config-v$V.tar.gz" jorcord-livekit-config
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: asset-server, path: out/*, if-no-files-found: error }

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: needs.prepare.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jorcord-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.is_release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- desktop
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, args: '', name: linux }
          - { os: windows-latest, args: '', name: windows }
          - { os: macos-latest, args: '--target aarch64-apple-darwin', name: macos-arm64 }
          - { os: macos-15-intel, args: '--target x86_64-apple-darwin', name: macos-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jorcord/shared build --if-present
      - name: Build bundles
        shell: bash
        working-directory: apps/desktop
        env:
          # Optional secrets: unsigned bundles are produced when they are empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          ARGS="${{ matrix.args }}"
          # Without an updater signing key, skip updater artifacts (they need one).
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then ARGS="$ARGS --config src-tauri/tauri.noupdater.conf.json"; fi
          # Drop empty Apple vars so Tauri does not try to import an empty certificate.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "[ -n \"\$$v\" ] || unset $v"
          done
          pnpm exec tauri build $ARGS
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: 'asset-desktop-${{ matrix.name }}', path: out/*, if-no-files-found: error }

  # ---------------------------------------------------------------- android
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jorcord/shared build --if-present
      - run: pnpm --filter @jorcord/web build
      - name: Signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}" >> "$GITHUB_ENV"
            echo "SIGNING=your configured release keystore" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16); echo "::add-mask::$P"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias jorcord -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Jorcord CI (ephemeral), O=Jorcord"
            echo "ANDROID_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=jorcord" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "SIGNING=an ephemeral CI keystore (no ANDROID_KEYSTORE_B64 secret set)" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_B64" ]; then echo "$GOOGLE_SERVICES_B64" | base64 -d > apps/mobile/android/app/google-services.json; fi
      - run: pnpm --filter @jorcord/mobile exec cap sync android
      - name: Build APKs and AAB
        working-directory: apps/mobile/android
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Collect and verify
        run: |
          set -e
          V=${{ needs.prepare.outputs.version }}
          B=apps/mobile/android/app/build/outputs
          mkdir -p out
          for f in $B/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "out/Jorcord-$V-android-$abi.apk"
          done
          cp $B/bundle/release/app-release.aab "out/Jorcord-$V-android.aab"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "out/Jorcord-$V-android-universal.apk" | head -3
          echo "$SIGNING" > out/.signing; ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: asset-android
          path: |
            out/*
            out/.signing
          include-hidden-files: true
          if-no-files-found: error

  # ---------------------------------------------------------------- ios
  ios:
    # Unsigned: Apple signing needs your account. We package the unsigned archive as an .ipa that sideloaders can re-sign.
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "Using $X"
          sudo xcode-select -s "$X"; xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jorcord/shared build --if-present
      - run: pnpm --filter @jorcord/web build
      - run: pnpm --filter @jorcord/mobile exec cap sync ios
      - name: Unsigned archive
        working-directory: apps/mobile/ios/App
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          WS=App.xcworkspace; [ -d "$WS" ] || WS=""
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Jorcord.xcarchive" archive \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60
      - name: Package unsigned .ipa
        run: |
          set -e
          mkdir -p out ipa/Payload
          cp -R "$RUNNER_TEMP/Jorcord.xcarchive/Products/Applications/App.app" ipa/Payload/
          (cd ipa && zip -qry "$GITHUB_WORKSPACE/out/Jorcord-${{ needs.prepare.outputs.version }}-ios-unsigned.ipa" Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: asset-ios, path: out/*, if-no-files-found: error }

  # ---------------------------------------------------------------- publish (single, non-draft release)
  release:
    needs: [prepare, web, server-bundle, docker, desktop, android, ios]
    if: always() && needs.prepare.result == 'success' && needs.web.result == 'success' && needs.server-bundle.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' && needs.docker.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'asset-*', path: collected, merge-multiple: true }
      - name: Checksums and notes
        env:
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -e
          V=${{ needs.prepare.outputs.version }}
          mkdir release
          SIGNING=$(cat collected/.signing 2>/dev/null || echo unknown); rm -f collected/.signing
          mv collected/* release/
          sed "s/VERSION/$V/g" .github/release-notes.md > notes.md
          { echo; echo "Android APKs in this release are signed with $SIGNING."; } >> notes.md
          [ "$IOS_RESULT" = success ] || { echo; echo "**The iOS .ipa could not be built for this release** (CI job failed); build it yourself using docs/PLATFORMS.md."; } >> notes.md
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: { name: release-preview, path: 'release/*', retention-days: 7 }
      - if: needs.prepare.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Jorcord v${{ needs.prepare.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*
